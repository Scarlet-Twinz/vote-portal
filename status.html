<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Status - Voters Registration Portal</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ============================== -->
    <!-- NAVIGATION                     -->
    <!-- ============================== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-vote-yea"></i> VoterPortal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link active" href="status.html">Check Status</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================== -->
    <!-- STATUS CHECK                   -->
    <!-- ============================== -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">

                    <div class="form-container">
                        <div class="text-center mb-4">
                            <i class="fas fa-search fa-3x text-primary"></i>
                            <h3 class="mt-2">Check Registration Status</h3>
                            <p class="text-muted">Enter your NIN or Application Number</p>
                        </div>

                        <form id="statusForm" onsubmit="handleStatusCheck(event)">

                            <div class="mb-3">
                                <label class="form-label fw-bold">Search by</label>
                                <select id="searchType" class="form-select">
                                    <option value="nin">NIN (National ID)</option>
                                    <option value="application">Application Number</option>
                                    <option value="voterId">Voter ID</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Enter Value</label>
                                <input type="text" id="searchValue" class="form-control" placeholder="e.g. 12345678901" required />
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-search"></i> Check Status
                            </button>
                        </form>

                        <div id="statusResult" class="mt-3"></div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <!-- ============================== -->
    <!-- FOOTER                         -->
    <!-- ============================== -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Voters Registration Portal. All rights reserved.</p>
        </div>
    </footer>

    <!-- ============================== -->
    <!-- SCRIPTS                        -->
    <!-- ============================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>

    <script>
        function handleStatusCheck(event) {
            event.preventDefault();

            const searchType = document.getElementById('searchType').value;
            const searchValue = document.getElementById('searchValue').value.trim();
            const resultDiv = document.getElementById('statusResult');

            if (!searchValue) {
                showError('Please enter a value to search!');
                return;
            }

            let voter = null;

            if (searchType === 'nin') {
                voter = findVoterByNIN(searchValue);
            } else if (searchType === 'application') {
                voter = findVoterByApplication(searchValue);
            } else if (searchType === 'voterId') {
                voter = findVoterByID(searchValue);
            }

            if (!voter) {
                resultDiv.innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>No record found!</strong><br />
                        No voter found with the provided ${searchType}.
                    </div>
                `;
                return;
            }

            let statusColor = '';
            let statusIcon = '';
            let statusText = voter.status;

            switch (voter.status) {
                case 'Approved':
                    statusColor = 'success';
                    statusIcon = 'fa-check-circle';
                    break;
                case 'Pending':
                    statusColor = 'warning';
                    statusIcon = 'fa-clock';
                    break;
                case 'Rejected':
                    statusColor = 'danger';
                    statusIcon = 'fa-times-circle';
                    break;
                case 'Active':
                    statusColor = 'success';
                    statusIcon = 'fa-check-circle';
                    break;
                default:
                    statusColor = 'secondary';
                    statusIcon = 'fa-question-circle';
            }

            resultDiv.innerHTML = `
                <div class="card border-0 shadow-sm mt-3">
                    <div class="card-body">
                        <h5 class="card-title text-primary">
                            <i class="fas fa-id-card"></i> ${voter.fullName}
                        </h5>

                        <div class="row mt-3">
                            <div class="col-6">
                                <small class="text-muted">Voter ID</small>
                                <p class="fw-bold">${voter.voterId || 'N/A'}</p>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">Application Number</small>
                                <p class="fw-bold">${voter.applicationNumber || 'N/A'}</p>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-6">
                                <small class="text-muted">NIN</small>
                                <p class="fw-bold">${maskNIN(voter.nin)}</p>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">LGA</small>
                                <p class="fw-bold">${voter.lga || 'N/A'}</p>
                            </div>
                        </div>

                        <hr />

                        <div class="text-center">
                            <h4>
                                <span class="badge bg-${statusColor} fs-6 p-2">
                                    <i class="fas ${statusIcon}"></i> ${voter.status}
                                </span>
                            </h4>
                            <small class="text-muted">
                                Registered on ${formatDate(voter.createdAt)}
                            </small>
                        </div>

                        ${voter.status === 'Approved' || voter.status === 'Active' ? `
                        <div class="text-center mt-3">
                            <a href="pvc.html?voterId=${voter.voterId}" class="btn btn-success btn-sm">
                                <i class="fas fa-download"></i> Download PVC
                            </a>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }
    </script>

</body>
</html>
